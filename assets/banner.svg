<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Node Glow Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" opacity="0.35" />
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.3" />
    </pattern>

    <!-- Drop Shadows & Filters -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulsePulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes signalFlow {
        0% { offset-distance: 0%; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .animated-dash-1 {
        stroke-dasharray: 8, 6;
        animation: dashMove 14s linear infinite;
      }
      .animated-dash-2 {
        stroke-dasharray: 6, 8;
        animation: dashMove 10s linear infinite reverse;
      }
      .node-card-left {
        animation: floatSlow1 7s ease-in-out infinite;
        transform-origin: center;
      }
      .node-card-right {
        animation: floatSlow2 8s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-pill {
        animation: pulsePulse 4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid-pattern)" rx="16" />

  <!-- Ambient Light Orbs (Background) -->
  <circle cx="180" cy="90" r="130" fill="#6366f1" opacity="0.15" filter="url(#glow-blur)" />
  <circle cx="1020" cy="220" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow-blur)" />
  <circle cx="600" cy="60" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow-blur)" />

  <!-- Background Dynamic Circuit & Flow Pipelines -->
  <g opacity="0.5">
    <path class="animated-dash-1" d="M 120 70 C 240 70, 240 170, 360 170 S 480 110, 600 110 S 720 230, 840 230 S 960 120, 1080 120" 
          fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="animated-dash-2" d="M 100 240 C 220 240, 260 120, 380 120 S 520 240, 640 240 S 800 90, 920 90 S 1040 250, 1100 250" 
          fill="none" stroke="#06b6d4" stroke-width="2" />
  </g>

  <!-- Left Dynamic Floating Node Card (Background Decor) -->
  <g class="node-card-left" filter="url(#soft-shadow)">
    <rect x="50" y="105" width="165" height="110" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
    <!-- Node Header -->
    <rect x="50" y="105" width="165" height="30" rx="12" fill="#334155" fill-opacity="0.4" />
    <circle cx="70" cy="120" r="5" fill="#ef4444" />
    <circle cx="85" cy="120" r="5" fill="#f59e0b" />
    <circle cx="100" cy="120" r="5" fill="#10b981" />
    <text x="120" y="124" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">POST /webhook</text>
    <!-- Node Body -->
    <rect x="66" y="148" width="80" height="10" rx="5" fill="#475569" opacity="0.6" />
    <rect x="66" y="166" width="130" height="8" rx="4" fill="#38bdf8" opacity="0.7" />
    <rect x="66" y="182" width="105" height="8" rx="4" fill="#a855f7" opacity="0.6" />
    <!-- Connector Port -->
    <circle cx="215" cy="160" r="6" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Right Dynamic Floating Node Card (Background Decor) -->
  <g class="node-card-right" filter="url(#soft-shadow)">
    <rect x="980" y="95" width="170" height="120" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.2" />
    <!-- Node Header -->
    <rect x="980" y="95" width="170" height="30" rx="12" fill="#334155" fill-opacity="0.4" />
    <circle cx="1000" cy="110" r="5" fill="#8b5cf6" />
    <text x="1015" y="114" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">LLM &amp; Microservice</text>
    <!-- Node Body -->
    <rect x="996" y="140" width="100" height="9" rx="4" fill="#ec4899" opacity="0.7" />
    <rect x="996" y="157" width="135" height="8" rx="4" fill="#475569" opacity="0.6" />
    <rect x="996" y="173" width="115" height="8" rx="4" fill="#10b981" opacity="0.7" />
    <!-- Connector Port -->
    <circle cx="980" cy="155" r="6" fill="#ec4899" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Top Decorative Category Pills -->
  <g class="pulse-pill">
    <!-- Center Left Pill -->
    <rect x="360" y="32" width="145" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="376" cy="46" r="4" fill="#6366f1" />
    <text x="390" y="50" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ API Orchestration</text>

    <!-- Center Right Pill -->
    <rect x="525" y="32" width="155" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
    <circle cx="541" cy="46" r="4" fill="#ec4899" />
    <text x="555" y="50" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤖 Agentic Workflows</text>

    <!-- Far Right Pill -->
    <rect x="700" y="32" width="140" height="28" rx="14" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.9" />
    <circle cx="716" cy="46" r="4" fill="#06b6d4" />
    <text x="730" y="50" fill="#cffafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎨 Visual Canvases</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (Always Visible, Unobscured) -->
  <g filter="url(#soft-shadow)">
    <!-- Primary Heading -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="-0.5">
      <tspan fill="#ffffff">Awesome Visual API </tspan>
      <tspan fill="url(#primary-glow)">Workflow Builder</tspan>
    </text>

    <!-- Secondary Heading / Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#cbd5e1" letter-spacing="1">
      &amp; ORCHESTRATION PLATFORMS
    </text>

    <!-- Detailed Descriptor -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14.5" fill="#94a3b8">
      Curated open-source engines, self-hostable pipelines, and enterprise iPaaS tools for modern API-first automation
    </text>
  </g>

  <!-- Foreground Status Indicators Bar (Bottom) -->
  <g transform="translate(260, 268)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="190" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Open-Source Ranked</text>

    <!-- Badge 2 -->
    <rect x="205" y="0" width="220" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="225" cy="17" r="5" fill="#38bdf8" />
    <text x="240" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SaaS Pricing &amp; Market Stats</text>

    <!-- Badge 3 -->
    <rect x="440" y="0" width="240" height="34" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="460" cy="17" r="5" fill="#f59e0b" />
    <text x="475" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">REST • GraphQL • AI Agents</text>
  </g>

</svg>
